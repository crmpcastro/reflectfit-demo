  .rf { --ink:#233d32; --muted:#607167; --green:#386249; --line:#e1e8df;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink); background:#f6f8f4; min-height:100vh; line-height:1.55; }
  .rf *, .rf *::before, .rf *::after { box-sizing:border-box; }
  .rf button,.rf input,.rf select,.rf textarea { font:inherit; }
  .rf button { cursor:pointer; }
  .rf button:disabled { cursor:default; opacity:.65; }
  .rf button,.rf a,.rf input,.rf select,.rf textarea { -webkit-tap-highlight-color:transparent; }
  .rf :focus-visible { outline:3px solid #6c9474; outline-offset:4px; }
  .rf h1,.rf h2,.rf h3,.rf p { margin:0; }
  .rf svg { flex-shrink:0; }
  .rf-shell { display:flex; min-height:100vh; }
  .rf-sidebar { width:254px; flex-shrink:0; padding:38px 21px 24px; background:#fff;
    border-right:1px solid var(--line); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .rf-logo { display:flex; align-items:center; gap:10px; padding:0 12px; font-size:25px; letter-spacing:-1px; font-weight:700; }
  .rf-logo-mark { display:grid; place-items:center; border-radius:12px; width:38px; height:38px; background:#e9f0e5; color:#386249; }
  .rf-nav { display:flex; flex-direction:column; gap:7px; margin-top:49px; }
  .rf-nav button { display:flex; align-items:center; gap:12px; width:100%; border:0; border-radius:10px;
    background:transparent; padding:13px 15px; color:#607167; text-align:left; font-size:13px; font-weight:550; }
  .rf-nav button:hover { background:#f3f6f0; color:var(--ink); }
  .rf-nav button[aria-current="page"] { color:#31583d; background:#eaf1e5; font-weight:650; }
  .rf-nav-dot { margin-left:auto; width:6px; height:6px; background:#537950; border-radius:50%; }
  .rf-side-note { margin-top:auto; padding:20px 14px; color:var(--muted); font-size:12px; }
  .rf-profile { display:flex; align-items:center; gap:10px; border-top:1px solid var(--line); padding:22px 10px 0; font-size:13px; }
  .rf-avatar { display:grid; place-items:center; height:36px; width:36px; border-radius:50%; background:#edf0e7; color:#486141; font-weight:650; }
  .rf-main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .rf-topbar { height:83px; padding:0 48px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); }
  .rf-topbar-right { display:flex; align-items:center; gap:8px; }
  .rf-demo { background:#edf1e8; color:#52634b; padding:4px 10px; border-radius:6px; font-size:10px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; }
  .rf-content { max-width:1190px; width:100%; margin:0 auto; padding:42px 48px 30px; flex:1; }
  .rf-eyebrow { color:#5f7758; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.17em; margin-bottom:12px!important; }
  .rf h1 { font-size:clamp(27px,3vw,37px); font-weight:550; letter-spacing:-1.3px; line-height:1.22; }
  .rf-subtitle { margin-top:12px!important; font-size:13px; color:var(--muted); max-width:620px; line-height:1.8; }
  .rf-card { background:#fff; border:1px solid var(--line); border-radius:17px; padding:27px; }
  .rf-card h2 { font-size:17px; font-weight:600; letter-spacing:-.3px; }
  .rf-card h3 { font-size:14px; font-weight:600; }
  .rf-muted { color:var(--muted); font-size:12px; line-height:1.8; }
  .rf-layout { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr); gap:23px; margin-top:30px; align-items:start; }
  .rf-stack { display:grid; gap:22px; }
  .rf-fields { display:grid; gap:22px; margin-top:26px; }
  .rf-label { display:block; font-size:12px; font-weight:650; margin-bottom:8px; }
  .rf-help { color:var(--muted); font-size:11px; margin-top:7px!important; }
  .rf-input { width:100%; min-height:45px; border:1px solid #cdd8cb; border-radius:8px; background:#fcfdfb; color:var(--ink); padding:11px 13px; font-size:13px!important; }
  .rf-input:hover { border-color:#8da288; }
  .rf textarea { resize:vertical; min-height:100px; }
  .rf-input-unit { position:relative; }
  .rf-input-unit input { padding-right:115px; }
  .rf-input-unit span { position:absolute; right:14px; top:13px; font-size:12px; color:var(--muted); pointer-events:none; }
  .rf-btn { border:1px solid transparent; border-radius:9px; padding:12px 19px; font-size:12px!important;
    font-weight:600!important; display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:46px; transition:background .15s,transform .15s; }
  .rf-btn:hover { transform:translateY(-1px); }
  .rf-primary { color:#fff; background:#386249; }
  .rf-primary:hover { background:#2c503b; }
  .rf-secondary { color:#386249; background:#fff; border-color:#cdd8cb; }
  .rf-secondary:hover { background:#f0f5ed; }
  .rf-form-bottom { border-top:1px solid var(--line); margin-top:25px; padding-top:23px; display:grid; gap:13px; }
  .rf-soft { background:#edf3e8; border-color:#e0e8d9; }
  .rf-note { display:flex; gap:10px; align-items:flex-start; border-radius:10px; padding:14px; background:#f3f6ef; color:#53694c; font-size:11px; line-height:1.8; }
  .rf-art { width:100%; height:152px; display:block; margin:4px 0 17px; }
  .rf-preview { border-top:1px solid #d6e0d0; margin-top:23px; padding-top:19px; }
  .rf-mini-bars { display:flex; gap:13px; align-items:end; height:83px; padding-top:12px; }
  .rf-mini-bars span { flex:1; background:#72916a; border-radius:5px 5px 2px 2px; min-height:8px; }
  .rf-tiny { font-size:10px; color:var(--muted); }
  .rf-feature { display:flex; align-items:center; gap:12px; padding:8px 0; font-size:12px; }
  .rf-feature-icon { display:grid; place-items:center; height:30px; width:30px; border-radius:9px; background:#f0f4eb; color:#59764c; }
  .rf-footer { padding:18px 30px 24px; text-align:center; font-size:10px; color:#65735e; }
  .rf-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin:28px 0 23px; }
  .rf-stat { display:flex; align-items:flex-start; justify-content:space-between; padding:21px; }
  .rf-stat-value { font-size:25px; font-weight:550; letter-spacing:-.8px; margin-top:8px!important; }
  .rf-stat-unit { font-size:11px; color:var(--muted); letter-spacing:0; font-weight:400; margin-left:5px; }
  .rf-title-row { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .rf-legend { display:flex; gap:14px; font-size:10px; color:var(--muted); }
  .rf-legend span { display:flex; align-items:center; gap:6px; }
  .rf-key { width:8px; height:8px; border-radius:2px; background:#64885c; }
  .rf-key-light { background:#e0e9d8; }
  .rf-chart { display:flex; gap:12px; margin-top:26px; }
  .rf-chart-column { flex:1; min-width:0; text-align:center; }
  .rf-bar-space { height:150px; position:relative; display:flex; align-items:end; justify-content:center; gap:4px;
    border-bottom:1px solid #d9e3d3; background:repeating-linear-gradient(to top,transparent 0,transparent 49px,#eff3ec 49px,#eff3ec 50px); }
  .rf-bar { width:24px; max-width:35%; min-height:3px; border-radius:5px 5px 0 0; background:#64885c; z-index:1; }
  .rf-bar-plan { background:#e0e9d8; }
  .rf-chart-value { font-size:12px; margin-top:11px!important; font-weight:650; }
  .rf-week-label { font-size:10px; color:var(--muted); margin-top:3px!important; }
  .rf-adjustment { font-size:9px; color:#596e50; margin-top:7px!important; line-height:1.4; min-height:26px; }
  .rf-day-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-top:22px; }
  .rf-day { text-align:center; border-radius:9px; padding:12px 2px; background:#f6f8f3; font-size:10px; color:var(--muted); }
  .rf-day strong { display:block; font-size:15px; margin-top:10px; color:#67825c; }
  .rf-day-focus { border:1px solid #aebfa3; background:#eaf0e2; color:#3e5a36; }
  .rf-pill { display:inline-flex; gap:6px; align-items:center; padding:4px 9px; border-radius:6px; font-size:10px; background:#eaf1e4; color:#46603b; }
  .rf-insight { display:flex; gap:15px; align-items:flex-start; }
  .rf-insight h2 { line-height:1.65; }
  .rf-slider { width:100%; accent-color:#537a49; cursor:pointer; min-height:30px; }
  .rf-slider-labels { display:flex; justify-content:space-between; gap:6px; font-size:10px; color:var(--muted); }
  .rf-slider-labels span { flex:1; text-align:center; }
  .rf-slider-labels span:first-child { text-align:left; }
  .rf-slider-labels span:last-child { text-align:right; }
  .rf-range-value { color:#4d7043; float:right; font-size:11px; }
  .rf-notice { display:flex; gap:10px; align-items:center; padding:14px 18px; margin-top:22px; border:1px solid #d5e3cd; border-radius:10px; background:#edf5e6; color:#36582f; font-size:12px; }
  .rf-summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:23px; }
